name: Build Magnetometer OpenSpace Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build-osfls:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: Magnetometers

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install numpy requests pandas xarray hapiclient

      - name: Run magnetometer vector pipeline
        # env:
        #   QRZ_USER: ${{ secrets.QRZ_USER }}
        #   QRZ_PASS: ${{ secrets.QRZ_PASS }}
        run: |
          chmod +x pipeline.sh
          ./pipeline.sh

      - name: Upload generated OpenSpace assets
        uses: actions/upload-artifact@v7
        with:
          name: magnetometer-openspace-assets
          path: Magnetometers/output/
