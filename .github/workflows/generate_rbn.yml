name: Build RBN OpenSpace Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build-osfls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache QRZ station database
        uses: actions/cache@v6
        with:
          path: data/station_cache.db
          key: rbn-station-cache-${{ github.run_id }}
          restore-keys: |
            rbn-station-cache-

      - name: Install dependencies
        run: pip install numpy requests

      - name: Run RBN pipeline
        env:
          QRZ_USER: ${{ secrets.QRZ_USER }}
          QRZ_PASS: ${{ secrets.QRZ_PASS }}
        run: |
          chmod +x pipeline.sh
          ./pipeline.sh

      - name: Upload generated OpenSpace assets
        uses: actions/upload-artifact@v7
        with:
          name: rbn-openspace-assets
          path: output/
